name: Publish to npm

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  # The full Oracle matrix is defined once, in the test workflow, and reused
  # here so that a release cannot be published against a different set of
  # checks from the ones that run on every push.
  test:
    name: Build and test
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      packages: read

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    environment: npm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing over OIDC needs npm >= 11.5.1 on Node >= 22.14.0,
      # which is newer than the runner default. `registry-url` is deliberately
      # omitted: it writes an `_authToken` line that makes npm attempt classic
      # auth and fail with ENEEDAUTH instead of falling back to OIDC.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      # Authenticates via OIDC against the npm trusted publisher configured for
      # this repository and workflow file; no token is required, and provenance
      # is attached automatically. NODE_AUTH_TOKEN must stay unset.
      - name: Publish to npm
        run: npm publish

  publish-report:
    name: Publish test report to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download all test reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-report-*
          path: test-reports

      - name: Prepare test reports for upload
        run: |
          # The SQL on FHIR conformance dashboard reads this implementation's
          # results from the fixed path `main/test_report.json`, so the report
          # is always published under `main/` regardless of the event that
          # triggered the workflow.
          REPORT_DIR="main"
          mkdir -p "${REPORT_DIR}"

          # The most recent supported Oracle version, in its default storage
          # configuration, provides the headline report.
          cp test-reports/test-report-26ai-blob/test-report.json "${REPORT_DIR}/test_report.json"

          # Also copy individual reports for each Oracle version.
          for version_dir in test-reports/test-report-*/; do
            version=$(basename "${version_dir}" | sed 's/test-report-//')
            cp "${version_dir}/test-report.json" "${REPORT_DIR}/test_report_${version}.json"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
