name: Build and test

on:
  push:
  pull_request:
  workflow_call:

env:
  SQLONFHIR_TEST_PATH: ./sqlonfhir/tests
  ORACLE_HOST: localhost
  ORACLE_PORT: "1521"
  ORACLE_USER: fhir
  ORACLE_PASSWORD: fhir

# The database runs as an explicitly started container rather than as a job
# service, because a service is started before the first step runs, and the
# runner's root filesystem has too little free space to hold these images. The
# free-disk-space action has to run first.
jobs:
  # Oracle Database 19c Enterprise Edition. The image is a private, self-built
  # package (Oracle Technology Network Developer Licence), pulled with the
  # workflow's GITHUB_TOKEN. Fork pull requests cannot read the package, so the
  # job is skipped for them.
  test-19c:
    name: Oracle 19c EE (BLOB)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    env:
      ORACLE_SERVICE_NAME: ORCLPDB1
      ORACLE_RESOURCE_JSON_DATA_TYPE: BLOB
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Start Oracle
        uses: ./.github/actions/start-oracle
        with:
          image: ghcr.io/aehrc/oracle-database-ee:19.3.0
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          environment: |
            ORACLE_SID=ORCLCDB
            ORACLE_PDB=ORCLPDB1
            ORACLE_PWD=oracle
            ORACLE_CHARACTERSET=AL32UTF8
            INIT_SGA_SIZE=1536
            INIT_PGA_SIZE=512
            INIT_CPU_COUNT=2

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Wait for Oracle
        uses: ./.github/actions/wait-for-oracle

      - name: Create application user
        run: >-
          sed "s/FREEPDB1/${ORACLE_SERVICE_NAME}/" docker/init/01_create_user.sql
          | docker exec -i oracle sqlplus -s / as sysdba

      - name: Run tests
        run: bun run test

      - name: Dump database log
        if: failure()
        run: docker logs --tail 200 oracle

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-19c-blob
          path: out/test-report.json
          retention-days: 30

  # Oracle Database 21c Express Edition and 23ai Free, pulled anonymously from
  # the Oracle Container Registry under their free-use licences. Both support
  # the native JSON type, so each version runs against both storage variants.
  test-free:
    name: Oracle ${{ matrix.label }} (${{ matrix.resource-json-data-type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 21c XE
            image: container-registry.oracle.com/database/express:21.3.0-xe
            service-name: XEPDB1
            resource-json-data-type: BLOB
            report-suffix: 21c-blob
          - label: 21c XE
            image: container-registry.oracle.com/database/express:21.3.0-xe
            service-name: XEPDB1
            resource-json-data-type: JSON
            report-suffix: 21c-json
          - label: 23ai Free
            image: container-registry.oracle.com/database/free:latest
            service-name: FREEPDB1
            resource-json-data-type: BLOB
            report-suffix: 23ai-blob
          - label: 23ai Free
            image: container-registry.oracle.com/database/free:latest
            service-name: FREEPDB1
            resource-json-data-type: JSON
            report-suffix: 23ai-json
    env:
      ORACLE_SERVICE_NAME: ${{ matrix.service-name }}
      ORACLE_RESOURCE_JSON_DATA_TYPE: ${{ matrix.resource-json-data-type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Start Oracle
        uses: ./.github/actions/start-oracle
        with:
          image: ${{ matrix.image }}
          environment: |
            ORACLE_PWD=oracle
            ORACLE_CHARACTERSET=AL32UTF8

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Wait for Oracle
        uses: ./.github/actions/wait-for-oracle

      - name: Create application user
        run: >-
          sed "s/FREEPDB1/${ORACLE_SERVICE_NAME}/" docker/init/01_create_user.sql
          | docker exec -i oracle sqlplus -s / as sysdba

      - name: Run tests
        run: bun run test

      - name: Dump database log
        if: failure()
        run: docker logs --tail 200 oracle

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.report-suffix }}
          path: out/test-report.json
          retention-days: 30
