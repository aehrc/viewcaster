name: Start Oracle Database
description: >-
  Pulls and starts an Oracle Database container in the background, publishing
  the listener on port 1521. The container is not waited on; use the
  wait-for-oracle action once the rest of the job setup is done.

inputs:
  image:
    description: Container image to run.
    required: true
  environment:
    description: Container environment, as newline-separated KEY=VALUE pairs.
    required: false
    default: ""
  name:
    description: Name to give the container.
    required: false
    default: oracle
  registry:
    description: Registry to authenticate against, if the image is private.
    required: false
    default: ""
  username:
    description: Registry username. Authentication is skipped when empty.
    required: false
    default: ""
  password:
    description: Registry password.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Log in to the container registry
      if: inputs.username != ''
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USERNAME: ${{ inputs.username }}
        REGISTRY_PASSWORD: ${{ inputs.password }}
      run: |
        printf '%s' "${REGISTRY_PASSWORD}" |
          docker login "${REGISTRY}" --username "${REGISTRY_USERNAME}" --password-stdin

    - name: Start the database container
      shell: bash
      env:
        ORACLE_IMAGE: ${{ inputs.image }}
        ORACLE_ENVIRONMENT: ${{ inputs.environment }}
        CONTAINER_NAME: ${{ inputs.name }}
      run: |
        # The image is pulled explicitly so that the download appears as a
        # distinct, timed part of the log, and so that a pull failure is not
        # confused with a container startup failure.
        docker pull "${ORACLE_IMAGE}"

        printf '%s\n' "${ORACLE_ENVIRONMENT}" |
          sed '/^[[:space:]]*$/d' > "${RUNNER_TEMP}/oracle.env"
        echo "Container environment:"
        cat "${RUNNER_TEMP}/oracle.env"

        # 1 GB of shared memory is the minimum these images will start with.
        docker run --detach \
          --name "${CONTAINER_NAME}" \
          --shm-size=1g \
          --publish 1521:1521 \
          --env-file "${RUNNER_TEMP}/oracle.env" \
          "${ORACLE_IMAGE}"

        echo "Disk usage after pulling the image:"
        df -h / /mnt
