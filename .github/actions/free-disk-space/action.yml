name: Free disk space
description: >-
  Moves the Docker data root onto the runner's large temporary disk, so that
  multi-gigabyte database images can be pulled without exhausting the root
  filesystem.

runs:
  using: composite
  steps:
    - name: Move the Docker data root to /mnt
      shell: bash
      run: |
        echo "Disk usage before:"
        df -h / /mnt

        # A GitHub-hosted runner has roughly 14 GB free on the root filesystem,
        # which is less than the Oracle 23ai Free image needs (about 13 GB),
        # and too little for the 21c XE container to write its redo logs. /mnt
        # is a separate disk with far more room, so Docker is pointed at it
        # before any image is pulled. The preloaded images are discarded rather
        # than copied across, as none of them are used here.
        sudo systemctl stop docker.service docker.socket
        sudo rm -rf /var/lib/docker
        sudo mkdir -p /mnt/docker /etc/docker

        if [ -f /etc/docker/daemon.json ]; then
          jq '."data-root" = "/mnt/docker"' /etc/docker/daemon.json > "${RUNNER_TEMP}/daemon.json"
        else
          echo '{"data-root": "/mnt/docker"}' > "${RUNNER_TEMP}/daemon.json"
        fi
        sudo mv "${RUNNER_TEMP}/daemon.json" /etc/docker/daemon.json

        sudo systemctl start docker.service
        docker info --format 'Docker data root: {{ .DockerRootDir }}'

        echo "Disk usage after:"
        df -h / /mnt
